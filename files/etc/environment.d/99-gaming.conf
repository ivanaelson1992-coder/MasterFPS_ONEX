# Vulkan / GPU
VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.x86_64.json:/usr/share/vulkan/icd.d/intel_icd.x86_64.json:/usr/share/vulkan/icd.d/nvidia_icd.json
RADV_PERFTEST=aco,ngg,nggc,mesh_shaders,fast_clear,fsr
ANV_ENABLE_GEN12_WA=1
MESA_SHADER_CACHE_DIR=/var/cache/mesa_shader_cache
MESA_GL_VERSION_OVERRIDE=4.6
MESA_VULKAN_VERSION_OVERRIDE=1.3

# Wine / Proton
WINEESYNC=1
WINEFSYNC=1
WINEDLLOVERRIDES="winemenubuilder.exe=d"
PROTON_ENABLE_NVAPI=1
PROTON_HIDE_NVIDIA_GPU=0
DXVK_ASYNC=1
VKD3D_CONFIG=dxr11,multi_queue

# Gamescope
GAMESCOPE_EXTERNAL_OVERLAY=1