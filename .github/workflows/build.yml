name: Build MasterFPS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Liberar espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Instalar Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts pacman-package-manager zstd squashfs-tools xorriso mtools dosfstools python3-pip systemd-container
          sudo pip install --break-system-packages git+https://github.com/systemd/mkosi.git

      - name: Build Image
        run: |
          chmod +x mkosi.build mkosi.postinst
          sudo mkosi --force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterFPS-x86_64-Image
          path: out/*