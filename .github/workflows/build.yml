name: Build MasterFPS ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Instalar Dependencias
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git python python-pip arch-install-scripts squashfs-tools libisoburn mtools dosfstools zstd systemd mkosi cpio tar xz gzip bzip2

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MasterFPS
        run: |
          chmod +x mkosi.build mkosi.postinst
          mkosi --force build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterFPS-Image
          path: out/*
