name: Build MasterFPS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Instalar Dependencias
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git python python-pip arch-install-scripts squashfs-tools libisoburn mtools dosfstools zstd systemd cpio tar xz gzip bzip2 device-mapper
          pip install --break-system-packages git+https://github.com/systemd/mkosi.git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MasterFPS
        run: |
          set +e
          chmod +x mkosi.build mkosi.postinst || true
          {
            echo "===== mkosi version ====="
            mkosi --version
            echo "===== repository files ====="
            ls -la
            echo "===== arch/cpu info ====="
            uname -a
          } > build.log 2>&1
          mkosi --force build >> build.log 2>&1
          code=$?
          echo "MKOSI_EXIT_CODE=$code" >> build.log
          echo "===== out directory =====" >> build.log
          ls -la out >> build.log 2>&1
          tail -n 150 build.log
          exit $code

      - name: Publicar log no branch ci-logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f build.log
          git commit -m "CI build log $(date -u +%FT%TZ)" || true
          git push -f origin ci-logs || true

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MasterFPS-Image
          path: |
            out/*
            out/**/*
          if-no-files-found: warn

      - name: Debug output directory
        if: always()
        run: |
          echo "=== Checking out directory ==="
          find out -type f -name "*.raw*" -o -name "*.img*" -o -name "*.iso*" 2>/dev/null | head -20
          ls -la out/ 2>/dev/null || echo "out directory does not exist"
          ls -la /var/lib/mkosi/ 2>/dev/null | head -20 || echo "mkosi cache not accessible"
