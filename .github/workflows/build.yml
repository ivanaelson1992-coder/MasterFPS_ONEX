name: Build MasterFPS ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaco em disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Instalar dependencias no Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            systemd \
            systemd-container \
            systemd-repart \
            arch-install-scripts \
            pacman \
            xorriso \
            mtools \
            dosfstools \
            zstd \
            squashfs-tools \
            python3-pip \
            qemu-utils
          sudo pip install --break-system-packages --ignore-installed git+https://github.com/systemd/mkosi.git

      - name: Build MasterFPS
        run: |
          chmod +x mkosi.build mkosi.postinst
          sudo mkosi --force build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterFPS-Image
          path: out/*
