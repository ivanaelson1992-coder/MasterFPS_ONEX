name: Build MasterFPS ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y mkosi arch-install-scripts pacman xorriso mtools dosfstools zstd
          sudo pip install --break-system-packages git+https://github.com/systemd/mkosi.git
          sudo mkosi --force build
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MasterFPS-ISO
          path: out/*
