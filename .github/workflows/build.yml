name: Build MasterFPS ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts pacman xorriso mtools dosfstools zstd systemd-container python3-pip systemd-boot
          sudo pip install --break-system-packages git+https://github.com/systemd/mkosi.git

      - name: Configurar Chaves Arch
        run: |
          sudo mkdir -p /etc/pacman.d/gnupg
          sudo pacman-key --init
          sudo pacman-key --populate archlinux || true

      - name: Build Image
        run: |
          mkdir -p output
          chmod +x mkosi.build mkosi.postinst
          # Usando o comando moderno 'build' do mkosi
          sudo mkosi --force --output-dir=output build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterFPS-Image
          path: output/*

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: MasterFPS Gaming OS v1.0.0
          files: output/*
          body: "Imagem MasterFPS completa: Drivers NVIDIA (GTX 950), Performance MÃ¡xima, Cursor Grande RGB e Atalhos."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
