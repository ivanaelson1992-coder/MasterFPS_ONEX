name: Build MasterFPS ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update
          # Remove mkosi do apt se existir para evitar conflito
          sudo apt-get remove -y mkosi || true
          sudo apt-get install -y arch-install-scripts pacman xorriso mtools dosfstools zstd python3-pip
          # Instala o mkosi atualizado ignorando versões anteriores
          sudo pip install --break-system-packages --ignore-installed git+https://github.com/systemd/mkosi.git
          sudo mkosi --force build
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MasterFPS-ISO
          path: out/*
