name: Build MasterFPS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Instalar Dependencias
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git python python-pip arch-install-scripts squashfs-tools libisoburn mtools dosfstools zstd systemd cpio tar xz gzip bzip2
          pip install --break-system-packages git+https://github.com/systemd/mkosi.git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug mkosi
        run: |
          mkosi --version
          mkosi --help

      - name: Validate mkosi config
        run: |
          mkosi --dry-run

      - name: Build MasterFPS
        run: |
          chmod +x mkosi.build mkosi.postinst
          mkosi --force --debug build 2>&1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterFPS-Image
          path: out/*