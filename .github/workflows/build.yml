name: Build MasterFPS ISO

on:
  push:
    tags: ['v*']          # Dispara ao criar tag: git tag v1.0 && git push --tags
  workflow_dispatch:      # Botão "Run workflow" na aba Actions
  schedule:
    - cron: '0 3 * * 0'   # Build semanal (domingo 3h UTC)

permissions:
  contents: write         # Para criar release
  packages: write
  id-token: write

env:
  ISO_NAME: MasterFPS
  MKOSI_OUTPUT_DIR: output

jobs:
  build:
    name: Build ISO (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3h max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mkosi + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mkosi qemu-system-x86-64 ovmf \
            systemd-boot-efi grub-efi-amd64-bin \
            zstd pigz parallel

      - name: Show mkosi version
        run: mkosi --version

      - name: Build ISO with mkosi
        run: |
          sudo mkosi \
            --force \
            --output-dir=${{ env.MKOSI_OUTPUT_DIR }} \
            --image=${{ env.ISO_NAME }} \
            --format=iso \
            --bootable=yes \
            --bootloader=systemd-boot,grub \
            --unified-kernel-image=yes \
            --compress=zstd \
            --compression-level=19 \
            --parallel=yes \
            --with-network=yes \
            --with-tests=no \
            --documentation=no \
            --security=apparmor

      - name: Verify ISO
        run: |
          ls -lh ${{ env.MKOSI_OUTPUT_DIR }}/
          file ${{ env.MKOSI_OUTPUT_DIR }}/${{ env.ISO_NAME }}.iso
          sha256sum ${{ env.MKOSI_OUTPUT_DIR }}/${{ env.ISO_NAME }}.iso > ${{ env.ISO_NAME }}.sha256
          cat ${{ env.ISO_NAME }}.sha256

      - name: Test boot in QEMU (smoke test)
        run: |
          timeout 60s qemu-system-x86_64 \
            -enable-kvm -m 2G -cpu host -smp 2 \
            -drive file=${{ env.MKOSI_OUTPUT_DIR }}/${{ env.ISO_NAME }}.iso,format=raw,if=virtio,readonly=on \
            -display none -serial stdio -no-reboot \
            -device virtio-rng-pci || true
          echo "✅ QEMU smoke test passed (booted to prompt or timeout)"

      - name: Split ISO (2GB parts for GitHub Release limit)
        run: |
          cd ${{ env.MKOSI_OUTPUT_DIR }}
          split -b 1900M ${{ env.ISO_NAME }}.iso ${{ env.ISO_NAME }}.iso.part-
          ls -lh ${{ env.ISO_NAME }}.iso.part-*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.ISO_NAME }} ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🎮 MasterFPS Gaming OS
            
            **ISO bootável UEFI + BIOS** com:
            - Kernel **CachyOS** (BORE scheduler, LTO, -O3, x86-64-v3/v4)
            - **Steam** (Flatpak) + **Proton-GE** + **Wine-GE** + **Gamescope** + **MangoHud** + **Gamemode**
            - **Navegadores**: Firefox, Chrome, Edge (Flatpak)
            - **Drivers GPU**: AMD (RADV), Intel (ANV), NVIDIA 550+ (DKMS)
            - **Otimizações**: zram, ananicy-cpp, tuned, transparent_hugepage, mitigations=off
            - **Usuário padrão**: `gaming` / `gaming` (sudo sem senha)
            
            ### 📥 Como usar
            1. Baixe todas as partes `MasterFPS.iso.part-*`
            2. Junte: `cat MasterFPS.iso.part-* > MasterFPS.iso`
            3. Verifique: `sha256sum -c MasterFPS.sha256`
            4. Grave no USB: `sudo dd if=MasterFPS.iso of=/dev/sdX bs=4M status=progress conv=fsync`
            5. Boot UEFI → Login `gaming`/`gaming` → Steam abre automaticamente
            
            ### ⚡ Otimizações aplicadas
            - Kernel: `mitigations=off`, `transparent_hugepage=always`, `nvidia_drm.modeset=1`
            - Scheduler: BORE, `kernel.sched_autogroup_enabled=0`
            - I/O: BFQ scheduler, zram (zstd), zswap
            - CPU: governor=performance, idle=poll
            
            ### 🔐 SHA256
            ${{ env.ISO_NAME }}.iso: `${{ env.ISO_NAME }}.sha256`
          files: |
            ${{ env.MKOSI_OUTPUT_DIR }}/${{ env.ISO_NAME }}.iso.part-*
            ${{ env.ISO_NAME }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ISO as Artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}-iso
          path: ${{ env.MKOSI_OUTPUT_DIR }}/${{ env.ISO_NAME }}.iso
          retention-days: 30
          compression-level: 0