name: Build MasterFPS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Instalar Archiso e Ferramentas
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed archiso git squashfs-tools libisoburn dosfstools mtools edk2-ovmf

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preparar Perfil Releng e Buildar ISO
        run: |
          cp -r /usr/share/archiso/configs/releng /tmp/profile
          cat archiso/packages.x86_64 >> /tmp/profile/packages.x86_64
          sort -u /tmp/profile/packages.x86_64 -o /tmp/profile/packages.x86_64
          cp -r archiso/airootfs/* /tmp/profile/airootfs/
          chmod +x /tmp/profile/airootfs/root/customize_airootfs.sh
          sed -i 's/iso_name="archlinux"/iso_name="MasterFPS"/' /tmp/profile/profiledef.sh
          sed -i 's/iso_label="ARCH_/iso_label="MASTERFPS_/' /tmp/profile/profiledef.sh
          mkdir -p /tmp/work out
          mkarchiso -v -w /tmp/work -o out /tmp/profile
          ls -lh out/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterFPS-x86_64-ISO
          path: out/*.iso