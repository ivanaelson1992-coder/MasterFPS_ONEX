name: Build MasterFPS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Instalar Git e Dependencias no Arch
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git mkosi arch-install-scripts squashfs-tools libisoburn mtools dosfstools python edk2-ovmf cpio zstd tar xz gzip bzip2

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Repositorios Arch + Multilib
        run: |
          mkdir -p mkosi.sandbox/etc/pacman.d
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > mkosi.sandbox/etc/pacman.d/mirrorlist
          cat << 'EOF' > mkosi.sandbox/etc/pacman.conf
          [options]
          HoldPkg = pacman glibc
          Architecture = auto
          SigLevel = Never
          ParallelDownloads = 5

          [core]
          Include = /etc/pacman.d/mirrorlist

          [extra]
          Include = /etc/pacman.d/mirrorlist

          [multilib]
          Include = /etc/pacman.d/mirrorlist
          EOF
          cp mkosi.sandbox/etc/pacman.conf /etc/pacman.conf

      - name: Build MasterFPS
        run: |
          chmod +x mkosi.build mkosi.postinst
          mkosi --force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterFPS-x86_64-Image
          path: |
            out/*
            *.raw*
            *.iso*