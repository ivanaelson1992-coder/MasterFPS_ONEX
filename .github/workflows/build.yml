name: Build MasterFPS ISO

on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  ISO_NAME: MasterFPS
  MKOSI_OUTPUT_DIR: output

jobs:
  build:
    name: Build ISO (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install dependencies & mkosi
        run: |
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts pacman-package-manager zstd squashfs-tools xorriso mtools dosfstools python3-pip systemd-container qemu-utils
          sudo pip install --break-system-packages git+https://github.com/systemd/mkosi.git

      - name: Initialize Arch/CachyOS keys
        run: |
          sudo mkdir -p /etc/pacman.d/gnupg
          sudo pacman-key --init || true
          sudo pacman-key --populate archlinux || true
          sudo pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com || true
          sudo pacman-key --lsign-key F3B607488DB35A47 || true

      - name: Make scripts executable
        run: |
          chmod +x mkosi.build mkosi.postinst files/usr/libexec/firstboot-setup || true

      - name: Build ISO with mkosi
        run: |
          mkdir -p ${{ env.MKOSI_OUTPUT_DIR }}
          sudo mkosi \
            --force \
            --output-dir=${{ env.MKOSI_OUTPUT_DIR }} \
            --image=${{ env.ISO_NAME }} \
            --format=iso \
            --bootable=yes \
            --compress=zstd \
            --with-network=yes

      - name: Verify & Hash ISO
        run: |
          ls -lh ${{ env.MKOSI_OUTPUT_DIR }}/
          if [ -f "${{ env.MKOSI_OUTPUT_DIR }}/${{ env.ISO_NAME }}.iso" ]; then
            sha256sum ${{ env.MKOSI_OUTPUT_DIR }}/${{ env.ISO_NAME }}.iso > ${{ env.ISO_NAME }}.sha256
            cat ${{ env.ISO_NAME }}.sha256
          fi

      - name: Split ISO (2GB parts for GitHub Release limit)
        run: |
          if [ -f "${{ env.MKOSI_OUTPUT_DIR }}/${{ env.ISO_NAME }}.iso" ]; then
            cd ${{ env.MKOSI_OUTPUT_DIR }}
            split -b 1900M ${{ env.ISO_NAME }}.iso ${{ env.ISO_NAME }}.iso.part-
            ls -lh ${{ env.ISO_NAME }}.iso.part-*
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.ISO_NAME }} ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🎮 MasterFPS Gaming OS (ISO Completa)

            **Otimizações inclusas:**
            - Kernel **CachyOS** (BORE scheduler, LTO, x86-64-v3/v4)
            - **NVIDIA GTX 950** (Driver 550+ DKMS + 32-bit + persistence)
            - **Modo Gamer / Performance Máxima**: Gamemode, tuned, power-profiles-daemon, mitigations=off
            - **Atalhos na Área de Trabalho**: Steam, Firefox, VS Code, FreeLLMAPI, OpenCode
            - **Cursor Grande Breeze** (48px)
            
            ### 📥 Como instalar
            1. Baixe todas as partes `MasterFPS.iso.part-*`
            2. Junte: `cat MasterFPS.iso.part-* > MasterFPS.iso`
            3. Grave no USB (Rufus no modo DD ou `dd` no Linux)
          files: |
            ${{ env.MKOSI_OUTPUT_DIR }}/${{ env.ISO_NAME }}.iso.part-*
            ${{ env.ISO_NAME }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}-iso
          path: ${{ env.MKOSI_OUTPUT_DIR }}/*
          retention-days: 30
